name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет устаревший прогон (экономия минут).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Кеш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка зависимостей
        run: npm ci

      # V28: правка schema.prisma без миграции проходила CI молча — migrate deploy
      # применял СТАРЫЕ миграции успешно, а падение случалось бы только в рантайме
      # при первом запросе к новой колонке. Дифф миграций ↔ схемы: exit 2 = дрейф = красный.
      - name: Схема соответствует миграциям (drift guard)
        run: npm run db:check

      - name: Миграции тестовой БД + тесты
        run: npm test

      - name: Линт
        run: npm run lint

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: Миграции и демо-данные (ci.db)
        run: |
          npx prisma migrate deploy
          npm run db:seed-demo
        env:
          DATABASE_URL: "file:./ci.db"
          BETTER_AUTH_SECRET: "ci-secret"
          BETTER_AUTH_URL: "http://localhost:3000"

      # V28: сборка ДО e2e. Раньше e2e шёл первым и webServer (npm run start)
      # падал на чистом раннере: «Could not find a production build in '.next'»
      # (провал V27 CI 2026-11-14). E2E обязан тестировать свежую сборку.
      - name: Production-сборка
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          BETTER_AUTH_SECRET: "ci-secret"

      - name: E2E (webServer поднимает собранный .next)
        run: npx playwright test
        env:
          DATABASE_URL: "file:./ci.db"
          BETTER_AUTH_SECRET: "ci-secret"
          BETTER_AUTH_URL: "http://localhost:3000"
          CI: "true"
