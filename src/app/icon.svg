<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Corvid — добрая ворона машет крылом">
  <defs>
    <linearGradient id="bg" x1="18" y1="8" x2="110" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#DBE4FF"/>
    </linearGradient>
    <linearGradient id="body" x1="40" y1="16" x2="88" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#333D55"/>
      <stop offset="1" stop-color="#1B2233"/>
    </linearGradient>
    <linearGradient id="wing" x1="86" y1="52" x2="112" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46536F"/>
      <stop offset="1" stop-color="#333D55"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="29.25" stroke="#C7D2FE" stroke-width="1.5"/>

  <!-- tuft -->
  <path d="M56 22c-3-7 0-12 4-8 1-8 5-9 7-3 4-6 8-3 6 4l-2 9z" fill="url(#body)"/>
  <!-- tail -->
  <path d="M43 96c-9 3-18 9-23 15 9 1 20-2 28-7z" fill="url(#body)"/>
  <!-- body -->
  <ellipse cx="64" cy="82" rx="31" ry="29" fill="url(#body)"/>
  <!-- head -->
  <circle cx="64" cy="45" r="26" fill="url(#body)"/>

  <!-- raised waving wing -->
  <path d="M84 55c8-4 14-12 17-22 1-4 1-7 0-10 4 2 7 6 8 10 1-3 2-6 1-9 5 4 7 10 6 16-1 10-8 18-18 21-5 2-10 0-14-3z" fill="url(#wing)"/>
  <path d="M92 52c4-6 7-13 8-20M99 55c4-5 7-11 9-17" stroke="#232B40" stroke-width="2" stroke-linecap="round"/>

  <!-- tucked wing -->
  <path d="M44 66c-6 7-7 17 0 23 3 3 8 1 8-3 0-6-2-11 0-17z" fill="#3B4761"/>

  <!-- eyes -->
  <ellipse cx="54" cy="44" rx="7.5" ry="8.5" fill="#fff"/>
  <ellipse cx="74" cy="44" rx="7.5" ry="8.5" fill="#fff"/>
  <circle cx="55.5" cy="45.5" r="3.7" fill="#141926"/>
  <circle cx="75.5" cy="45.5" r="3.7" fill="#141926"/>
  <circle cx="56.8" cy="43.8" r="1.3" fill="#fff"/>
  <circle cx="76.8" cy="43.8" r="1.3" fill="#fff"/>

  <!-- blush -->
  <circle cx="44" cy="56" r="4.5" fill="#FB7185" opacity=".35"/>
  <circle cx="84" cy="56" r="4.5" fill="#FB7185" opacity=".35"/>

  <!-- beak -->
  <path d="M57 52.5c4.5-2.7 9.5-2.7 14 0-1.6 4.2-4 7.4-7 9.5-3-2.1-5.4-5.3-7-9.5z" fill="#F59E0B"/>
  <path d="M61 58.5c2-1 4-1 6 0-1 1.6-2 2.8-3 3.7-1-.9-2-2.1-3-3.7z" fill="#D97706" opacity=".55"/>

  <!-- feet -->
  <path d="M55 108l-2 8m0 0-4 3m4-3 4 3M73 108l2 8m0 0-4 3m4-3 4 3" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle -->
  <path d="M116 14l1.4 4.1L121.5 20l-4.1 1.4L116 25l-1.4-3.6L110.5 20l4.1-1.9z" fill="#818CF8" opacity=".8"/>
</svg>
